<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c34"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Lịch Làm Việc Của PI</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:580px;margin:auto;padding:20px 16px 90px}.hero{background:linear-gradient(130deg,#172f59,#355f9b);color:white;padding:24px;border-radius:24px;box-shadow:0 14px 35px #18396525}.eyebrow{font-size:13px;opacity:.75}h1{font-size:25px;margin:7px 0 12px}.hero strong{font-size:21px}.hero p{margin:10px 0 0;opacity:.85;line-height:1.5}.card{background:white;border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 5px 24px #162b4810}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.toolbar h2{font-size:19px;margin:0}button{border:0;border-radius:12px;padding:11px 14px;background:#edf2fa;color:#234268;font-size:15px;font-weight:650;cursor:pointer}button.primary{background:#285da6;color:white}button.danger{background:#fde8e8;color:#a32020}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #77b5ff}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{margin-top:19px;color:#738098;font-size:12px;text-align:center}.days{margin-top:8px}.day{min-height:68px;padding:6px 2px;border-radius:12px;background:#f6f8fc;text-align:center;border:2px solid transparent;font-size:14px}.day.empty{background:transparent}.day.selected{border-color:#3464a8}.day.today .num{text-decoration:underline;font-weight:800}.num{font-weight:700}.tags{display:flex;flex-direction:column;gap:3px;margin-top:5px}.tag{font-size:10px;line-height:1.35;border-radius:5px;padding:2px 0}.day-shift{background:#dcecff;color:#174d92}.night-shift{background:#e8defe;color:#5e3c97}.off-shift{background:#e8f4e9;color:#36764a}.att-mark{background:#fff3cd;color:#8a6d00;font-weight:700}.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px;font-size:12px;color:#516079}.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px}.detail{line-height:1.7;color:#42536c}.detail h3{margin:0 0 8px;color:#192c48}.detail p{margin:5px 0}label{display:block;font-size:13px;color:#52617a;margin-bottom:7px;font-weight:600}input,select{width:100%;padding:13px;border:1px solid #cdd7e6;border-radius:12px;background:white;color:#17243b;font-size:16px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}form .full{grid-column:1/-1}.muted{color:#728198;font-size:13px;line-height:1.5}.toast{margin-top:10px;color:#286e49;font-size:13px;min-height:18px}.footer{text-align:center;color:#7d899c;font-size:12px;margin-top:24px}.att-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.att-grid button{padding:10px 6px;font-size:13px}.att-status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f0f6ff;font-size:14px;color:#1d3a63}.att-status b{color:#0d2a52}.pay-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.pay-box{background:#f0f6ff;border-radius:14px;padding:12px;text-align:center}.pay-box .val{font-size:22px;font-weight:800;color:#1d3a63;line-height:1.2}.pay-box .lbl{font-size:12px;color:#52617a;margin-top:3px}.pay-list{margin-top:12px;font-size:13px;color:#42536c;line-height:1.6;max-height:260px;overflow:auto}.pay-list div{padding:6px 0;border-bottom:1px dashed #e2e9f3}.pay-list div:last-child{border-bottom:0}.pay-list .hrs{float:right;font-weight:700;color:#1d3a63}@media(max-width:370px){main{padding:12px 9px 70px}.card{padding:12px}.day{min-height:62px}.tag{font-size:9px}}
</style></head><body><main><section class="hero"><div class="eyebrow">LỊCH CA LÀM VIỆC CÁ NHÂN</div><h1>Lịch Ca Của PI</h1><strong id="status">Đang tính lịch...</strong><p id="countdown"></p></section><section class="card"><div class="toolbar"><button id="prev" aria-label="Tháng trước">‹</button><h2 id="month"></h2><button id="next" aria-label="Tháng sau">›</button><button id="today">Hôm nay</button></div><div class="week"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div><div id="days" class="days"></div><div class="legend"><span><i class="dot day-shift"></i>Ca ngày</span><span><i class="dot night-shift"></i>Ca đêm</span><span><i class="dot off-shift"></i>Nghỉ</span><span><i class="dot att-mark"></i>Đã chấm</span></div></section><section class="card detail" id="detail" aria-live="polite"></section><section class="card"><div class="toolbar"><button id="payPrev" aria-label="Kỳ trước">‹</button><h2 id="payTitle" style="font-size:18px">Bảng công</h2><button id="payNext" aria-label="Kỳ sau">›</button></div><div class="pay-summary"><div class="pay-box"><div class="val" id="payHours">0</div><div class="lbl">Tổng giờ</div></div><div class="pay-box"><div class="val" id="payCong">0</div><div class="lbl">Số công (÷8)</div></div></div><div class="pay-list" id="payList"></div></section><section class="card"><h2 style="font-size:19px;margin:0 0 15px">⚙️ Cài đặt chu kỳ</h2><form id="settings"><div><label for="startDate">Ngày bắt đầu</label><input id="startDate" type="date" required></div><div><label for="startTime">Giờ bắt đầu</label><input id="startTime" type="time" required></div><div class="full"><label for="restHours">Thời gian nghỉ sau mỗi ca 12 tiếng</label><select id="restHours"><option value="8">Nghỉ 8 tiếng (chu kỳ 12/8)</option><option value="12">Nghỉ 12 tiếng (chu kỳ 12/12)</option><option value="16">Nghỉ 16 tiếng (chu kỳ 12/16)</option><option value="24">Nghỉ 24 tiếng (chu kỳ 12/24)</option><option value="36">Nghỉ 36 tiếng (chu kỳ 12/36)</option><option value="48">Nghỉ 48 tiếng (chu kỳ 12/48)</option></select></div><div class="full"><button class="primary" type="submit" style="width:100%">Lưu & tính lại lịch</button></div></form><div id="saved" class="toast" role="status"></div></section><p class="footer">BY DOUBLEB</p></main><script>
(()=>{'use strict';const KEY='lich-ca-personal-v1',NOTES_KEY='lich-ca-personal-notes-v1',ATT_KEY='lich-ca-personal-attendance-v1',HOUR=3600000,WORK=12*HOUR;const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;const datetime=d=>`${fmt(d)} ${hm(d)}`;const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const atMidnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const plusDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);let config={date:'2026-10-26',time:'07:00',restHours:24};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&/^\d{4}-\d{2}-\d{2}$/.test(saved.date)&&/^\d{2}:\d{2}$/.test(saved.time))config={...config,...saved,restHours:[8,12,16,24,36,48].includes(Number(saved.restHours))?Number(saved.restHours):24}}catch(e){};let notes={};try{notes=JSON.parse(localStorage.getItem(NOTES_KEY))||{}}catch(e){notes={}}let att={};try{att=JSON.parse(localStorage.getItem(ATT_KEY))||{}}catch(e){att={}}
/* ===== 7 loại chấm công: 10/11/12 ngày + 10/11/12 đêm + Nghỉ phép 8h ===== */
const SHIFT_TYPES={day10:{label:'Ca 10 ngày',hours:10,in:'07:00',out:'17:00',cls:'day-shift'},day11:{label:'Ca 11 ngày',hours:11,in:'07:00',out:'18:00',cls:'day-shift'},day12:{label:'Ca 12 ngày',hours:12,in:'07:00',out:'19:00',cls:'day-shift'},night10:{label:'Ca 10 đêm',hours:10,in:'19:00',out:'05:00 (+1)',cls:'night-shift'},night11:{label:'Ca 11 đêm',hours:11,in:'19:00',out:'06:00 (+1)',cls:'night-shift'},night12:{label:'Ca 12 đêm',hours:12,in:'19:00',out:'07:00 (+1)',cls:'night-shift'},leave8:{label:'Nghỉ phép',hours:8,in:'—',out:'—',cls:'off-shift'}};
let viewed=new Date(),selected=atMidnight(new Date());function cycle(){return (12+Number(config.restHours||24))*HOUR}function start(){const [y,m,d]=config.date.split('-').map(Number),[h,min]=config.time.split(':').map(Number);return new Date(y,m-1,d,h,min)}function occurrencesForDay(day){const CYCLE=cycle(),s=start().getTime(),a=atMidnight(day).getTime(),b=plusDays(day,1).getTime(),min=Math.max(0,Math.floor((a-s-WORK)/CYCLE)-1),max=Math.ceil((b-s)/CYCLE)+1,items=[];for(let k=min;k<=max;k++){const t=s+k*CYCLE;if(t>=b||t+WORK<=a)continue;items.push({begin:new Date(t),end:new Date(t+WORK),starts:t>=a&&t<b})}return items}function isDay(d){const h=d.getHours();return h>=6&&h<18}function labels(day){const items=occurrencesForDay(day),starts=items.filter(x=>x.starts);if(starts.length)return starts.map(x=>({label:isDay(x.begin)?'Ngày':'Đêm',cls:isDay(x.begin)?'day-shift':'night-shift'}));if(items.length)return [{label:'Tan ca',cls:'night-shift'}];return [{label:'Nghỉ',cls:'off-shift'}]}
function renderCalendar(){const y=viewed.getFullYear(),m=viewed.getMonth();$('month').textContent=`Tháng ${m+1}/${y}`;const grid=$('days');grid.replaceChildren();const offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='day empty';grid.append(blank)}const count=new Date(y,m+1,0).getDate();for(let n=1;n<=count;n++){const d=new Date(y,m,n),btn=document.createElement('button');btn.type='button';btn.className='day'+(dateKey(d)===dateKey(selected)?' selected':'')+(dateKey(d)===dateKey(new Date())?' today':'');btn.setAttribute('aria-label',fmt(d));const number=document.createElement('div');number.className='num';number.textContent=n;btn.append(number);if(notes[dateKey(d)]){const mark=document.createElement('div');mark.textContent='📝';mark.style.fontSize='10px';mark.setAttribute('aria-label','Có ghi chú');btn.append(mark)}const tags=document.createElement('div');tags.className='tags';for(const t of labels(d)){const el=document.createElement('span');el.className='tag '+t.cls;el.textContent=t.label;tags.append(el)}if(att[dateKey(d)]){const el=document.createElement('span');el.className='tag att-mark';el.textContent='✓ '+att[dateKey(d)].hours+'h';tags.append(el)}btn.append(tags);btn.addEventListener('click',()=>{selected=d;renderCalendar();renderDetail()});grid.append(btn)}}
function renderDetail(){const items=occurrencesForDay(selected),box=$('detail');box.replaceChildren();const h=document.createElement('h3');h.textContent='📅 '+fmt(selected);box.append(h);const add=t=>{const p=document.createElement('p');p.textContent=t;box.append(p)};if(!items.length){add('🌿 Ngày nghỉ – không có giờ làm trong ngày này.')}else{for(const x of items){add((x.starts?'🕒 Bắt đầu ca: ':'↪️ Ca từ hôm trước: ')+datetime(x.begin));add('🏁 Kết thúc ca: '+datetime(x.end))}add(`Lịch lặp lại: làm 12 giờ → nghỉ ${config.restHours} giờ. Ca bắt đầu cách nhau ${12+Number(config.restHours)} giờ.`)}
/* ===== CHẤM CÔNG ===== */
const divider=document.createElement('hr');divider.style.cssText='border:0;border-top:1px solid #e5ebf4;margin:16px 0';box.append(divider);
const attTitle=document.createElement('h3');attTitle.textContent='⏱️ Chấm công ngày này';box.append(attTitle);
const key=dateKey(selected),existing=att[key];
if(existing){const st=SHIFT_TYPES[existing.type];const status=document.createElement('div');status.className='att-status';status.innerHTML=`Đã chấm: <b>${st?st.label:existing.type}</b> – ${existing.hours}h${st&&st.in!=='—'?` (${st.in} → ${st.out})`:''}`;box.append(status);const delBtn=document.createElement('button');delBtn.type='button';delBtn.className='danger';delBtn.style.marginTop='8px';delBtn.textContent='🗑️ Xóa chấm công';delBtn.addEventListener('click',()=>{delete att[key];saveAtt();$('saved').textContent='Đã xóa chấm công ngày '+fmt(selected);renderCalendar();renderDetail();renderPayroll()});box.append(delBtn)}else{const hint=document.createElement('p');hint.className='muted';hint.style.margin='0 0 8px';hint.textContent='Chọn loại ca đã làm (ghi vào ngày bắt đầu ca):';box.append(hint);const grid=document.createElement('div');grid.className='att-grid';const order=['day10','night10','day11','night11','day12','night12','leave8'];for(const type of order){const st=SHIFT_TYPES[type];const b=document.createElement('button');b.type='button';b.textContent=type==='leave8'?'Nghỉ phép (8h)':`${st.hours}h ${type.startsWith('day')?'ngày':'đêm'}`;b.title=`${st.label}${st.in!=='—'?`: ${st.in} → ${st.out}`:''}`;b.addEventListener('click',()=>{att[key]={type,hours:st.hours,markedAt:Date.now()};saveAtt();$('saved').textContent='Đã chấm '+st.label+' ('+st.hours+'h) cho '+fmt(selected);renderCalendar();renderDetail();renderPayroll()});grid.append(b)}box.append(grid)}
const hint2=document.createElement('p');hint2.className='muted';hint2.textContent='Ca đêm bắt đầu(19:00) Ca ngày bắt đầu(7:00). ';box.append(hint2);
/* ===== GHI CHÚ ===== */
const divider2=document.createElement('hr');divider2.style.cssText='border:0;border-top:1px solid #e5ebf4;margin:16px 0';box.append(divider2);const title=document.createElement('h3');title.textContent='📝 Ghi chú cho ngày này';box.append(title);const label=document.createElement('label');label.htmlFor='dayNote';label.textContent='Việc cần nhớ, đổi ca, lịch hẹn...';box.append(label);const area=document.createElement('textarea');area.id='dayNote';area.rows=3;area.maxLength=2000;area.placeholder='Nhập ghi chú cho ngày '+fmt(selected)+'...';area.value=notes[dateKey(selected)]||'';area.style.cssText='width:100%;padding:12px;border:1px solid #cdd7e6;border-radius:12px;font:inherit;resize:vertical;background:#fff;color:#17243b';box.append(area);const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;margin-top:10px';const save=document.createElement('button');save.type='button';save.className='primary';save.textContent='Lưu ghi chú';save.addEventListener('click',()=>{const value=area.value.trim();if(value)notes[dateKey(selected)]=value;else delete notes[dateKey(selected)];try{localStorage.setItem(NOTES_KEY,JSON.stringify(notes));$('saved').textContent='✓ Đã lưu ghi chú cho '+fmt(selected)+'.'}catch(e){$('saved').textContent='Không thể lưu ghi chú trên trình duyệt này.'}renderCalendar();renderDetail()});actions.append(save);const clear=document.createElement('button');clear.type='button';clear.textContent='Xóa';clear.addEventListener('click',()=>{delete notes[dateKey(selected)];try{localStorage.setItem(NOTES_KEY,JSON.stringify(notes));$('saved').textContent='Đã xóa ghi chú cho '+fmt(selected)+'.'}catch(e){}renderCalendar();renderDetail()});actions.append(clear);box.append(actions);const hint3=document.createElement('p');hint3.className='muted';hint3.textContent='Ghi chú lưu hiện biểu tượng 📝 trên lịch.';box.append(hint3)}
function saveAtt(){try{localStorage.setItem(ATT_KEY,JSON.stringify(att))}catch(e){$('saved').textContent='Không lưu được chấm công vào trình duyệt.'}}
/* ===== BẢNG CÔNG KỲ 26→25 ===== */
let payBase=new Date();function payRange(base){const y=base.getFullYear(),m=base.getMonth();const end=new Date(y,m,25);const start=new Date(y,m-1,26);return {start,end}}function renderPayroll(){const {start:ps,end:pe}=payRange(payBase);$('payTitle').textContent=`Kỳ ${pad(ps.getDate())}/${pad(ps.getMonth()+1)} → ${pad(pe.getDate())}/${pad(pe.getMonth()+1)}/${pe.getFullYear()}`;let total=0;const rows=[];for(const [k,v] of Object.entries(att)){const [yy,mm,dd]=k.split('-').map(Number);const d=new Date(yy,mm-1,dd);if(d>=ps&&d<=pe){total+=v.hours;rows.push({d,type:v.type,hours:v.hours})}}rows.sort((a,b)=>a.d-b.d);$('payHours').textContent=(Math.round(total*100)/100).toString();$('payCong').textContent=(Math.round(total/8*10000)/10000).toString();const list=$('payList');list.replaceChildren();if(!rows.length){const p=document.createElement('div');p.style.color='#728198';p.textContent='Chưa có ngày nào được chấm công trong kỳ này.';list.append(p);return}for(const r of rows){const st=SHIFT_TYPES[r.type];const div=document.createElement('div');div.innerHTML=`<span>${fmt(r.d)} – ${st?st.label:r.type}</span><span class="hrs">${r.hours}h</span>`;list.append(div)}}
function nextInfo(now){const CYCLE=cycle(),s=start().getTime(),t=now.getTime(),k=Math.floor((t-s)/CYCLE),begin=s+Math.max(0,k)*CYCLE;if(t<s)return {active:false,next:s};if(t<begin+WORK)return {active:true,end:begin+WORK,next:begin+CYCLE};return {active:false,next:begin+CYCLE}}function renderClock(){const now=new Date(),x=nextInfo(now),target=x.active?x.end:x.next,diff=Math.max(0,target-now.getTime()),hours=Math.floor(diff/HOUR),minutes=Math.floor(diff%HOUR/60000);$('status').textContent=x.active?'🔵 Đang trong ca làm':'🟢 Đang nghỉ';$('countdown').textContent=`${x.active?'Còn đến khi tan ca':'Ca tiếp theo'}: ${datetime(new Date(target))} · ${hours} giờ ${minutes} phút`;if(dateKey(now)!==lastToday){lastToday=dateKey(now);renderCalendar()}}let lastToday=dateKey(new Date());
$('startDate').value=config.date;$('startTime').value=config.time;$('restHours').value=String(config.restHours);$('settings').addEventListener('submit',e=>{e.preventDefault();const date=$('startDate').value,time=$('startTime').value;if(!date||!time)return;config={date,time,restHours:Number($('restHours').value)};try{localStorage.setItem(KEY,JSON.stringify(config));$('saved').textContent='✓ Đã lưu cài đặt trên thiết bị này.'}catch(e){$('saved').textContent='Không lưu được vào trình duyệt; lịch vẫn được cập nhật trong phiên này.'}viewed=new Date(selected.getFullYear(),selected.getMonth(),1);renderCalendar();renderDetail();renderClock()});
$('prev').addEventListener('click',()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()-1,1);renderCalendar()});$('next').addEventListener('click',()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()+1,1);renderCalendar()});$('today').addEventListener('click',()=>{selected=atMidnight(new Date());viewed=new Date(selected.getFullYear(),selected.getMonth(),1);renderCalendar();renderDetail()});
$('payPrev').addEventListener('click',()=>{payBase=new Date(payBase.getFullYear(),payBase.getMonth()-1,1);renderPayroll()});$('payNext').addEventListener('click',()=>{payBase=new Date(payBase.getFullYear(),payBase.getMonth()+1,1);renderPayroll()});
renderCalendar();renderDetail();renderClock();renderPayroll();setInterval(renderClock,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
